<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="whiteBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Left) on Dark -->
  <g transform="translate(6, 6) scale(0.68)">
    <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" fill="#0E376E" stroke="#1E4D8C" stroke-width="2" />
    <line x1="28" y1="20" x2="50" y2="20" stroke="#00AEEF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
    <circle cx="28" cy="20" r="3" fill="#00AEEF" />
    <circle cx="50" cy="20" r="3" fill="#FFFFFF" />
    <line x1="72" y1="80" x2="50" y2="80" stroke="#00AEEF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="72" cy="80" r="3" fill="#00AEEF" />

    <!-- J in White -->
    <path d="M 42 32 L 42 62 C 42 69 37 72 31 72 C 26 72 23 68 23 64" 
          stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="42" cy="32" r="4.5" fill="#00AEEF" />

    <!-- S in Tech Blue -->
    <path d="M 68 37 C 68 33 63 31 57 31 C 49 31 46 36 48 43 C 50 50 67 49 68 59 C 69 68 60 73 51 73 C 45 73 39 70 38 65" 
          stroke="url(#whiteBlueGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="68" cy="37" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="51" r="3.5" fill="#00AEEF" />
  </g>

  <!-- Typography: JS INFORMATICS (White & Cyan) -->
  <text x="88" y="42" font-family="Montserrat, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#FFFFFF">
    JS <tspan fill="#00AEEF">INFORMATICS</tspan>
  </text>
  
  <!-- Official Tagline (Subtle Slate/Light Blue) -->
  <text x="89" y="60" font-family="Inter, sans-serif" font-weight="500" font-size="10.5" letter-spacing="0.3" fill="#94A3B8">
    Connecting Technology. Protecting What Matters.
  </text>
</svg>
